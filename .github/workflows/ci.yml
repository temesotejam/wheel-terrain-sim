name: CI

on:
  push:
    branches:
      - main
      - feature/initial-terramechanics-sim
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run v1 test suite
        run: npm test
